<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sakhi">
  <title>Sakhi</title>
  <!--
    The app's brand mark: the Devanagari letter स (sa, for Sakhi) on the rose
    tile used in the header.

    A tab icon is seen at 16px more often than anywhere else, so this is drawn
    for that size first: one glyph, one shape, high contrast, no fine detail
    that would turn to mush. The PNG fallbacks beside this file are rasterised
    from this same artwork, which matters because they carry the glyph as pixels
    and therefore render identically on machines without a Devanagari font.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C25A73"/>
      <stop offset="1" stop-color="#8E3550"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <!-- Sized to leave a clear margin inside the tile. A glyph that touches the
       rounded corners reads as cramped at 16px and gets clipped by the circular
       masks some platforms apply to app icons. -->
  <text x="32" y="45.5" text-anchor="middle"
        font-family="'Devanagari Sangam MN','Kohinoor Devanagari','Nirmala UI','Noto Sans Devanagari','Mangal',serif"
        font-size="38" font-weight="600" fill="#FFFFFF">स</text>
</svg>
